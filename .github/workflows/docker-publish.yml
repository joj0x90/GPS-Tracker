name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # or your default branch

env:
  IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/gps-tracker

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare build metadata
        id: meta
        run: |
          echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(TZ='Europe/Berlin' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_COMMIT_SHA="${{ steps.meta.outputs.commit_sha }}" \
            --build-arg APP_BUILD_TIMESTAMP="${{ steps.meta.outputs.build_timestamp }}" \
            -t "$IMAGE_NAME:latest" webserver

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:latest"
